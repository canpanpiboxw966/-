<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" width="100%" height="100%" fill="none">
  <defs>
    <!-- Main S Flow Gradient -->
    <linearGradient id="sGrad" x1="40" y1="410" x2="280" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#154e5b" />
      <stop offset="22%" stop-color="#1b6877" />
      <stop offset="48%" stop-color="#288f7a" />
      <stop offset="72%" stop-color="#42aa86" />
      <stop offset="92%" stop-color="#5fbe97" />
      <stop offset="100%" stop-color="#70c49f" />
    </linearGradient>

    <!-- Hexagon Gradient Top/Right (Lighter Mint/Emerald) -->
    <linearGradient id="hexGradLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2e967f" />
      <stop offset="100%" stop-color="#6fc39e" />
    </linearGradient>

    <!-- Hexagon Gradient Bottom/Left (Deeper Teal) -->
    <linearGradient id="hexGradDeep" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#17515e" />
      <stop offset="100%" stop-color="#319981" />
    </linearGradient>
</defs>
  <g id="soul-survey-symbol">
    
    <!-- Triangulation Network Lines -->
    <g stroke="#265952" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.82">
      <!-- Top Hexagon to Top Arc -->
      <line x1="232" y1="32" x2="190" y2="64" />
      <!-- Top Hexagon to Right Hexagon -->
      <line x1="232" y1="32" x2="266" y2="124" />
      <line x1="266" y1="124" x2="284" y2="222" />
      <!-- Right Hexagon to Center Spine -->
      <line x1="284" y1="222" x2="220" y2="252" />
      <!-- Center Hexagon Network -->
      <line x1="156" y1="268" x2="112" y2="238" />
      <!-- Lower Left Hexagon Triangulation Lines -->
      <line x1="26" y1="308" x2="78" y2="288" />
      <line x1="26" y1="308" x2="44" y2="370" />
    </g>

    
    <!-- Curved Tracks of S -->
    <g stroke="url(#sGrad)" stroke-linecap="round" stroke-linejoin="round">
      <!-- Outer Top Crown Arc -->
      <path
        d="M 142,105 C 152,72 184,58 226,62 C 242,64 252,72 258,84 C 265,96 264,108 252,114"
        stroke-width="12"
        fill="none"
      />
      <!-- Main Core S Ribbon -->
      <path
        d="M 276,134 C 278,124 272,112 256,104 C 235,92 195,94 152,118 C 114,140 88,180 94,226 C 100,268 136,298 184,332 C 228,362 245,394 235,420 C 220,455 160,465 106,442 C 72,426 50,394 44,360"
        stroke-width="22"
        fill="none"
      />
      <!-- Upper Inner Parallel Track -->
      <path
        d="M 188,64 C 150,70 120,95 110,132 C 100,172 120,204 152,230"
        stroke-width="8"
        fill="none"
      />
      <!-- Lower Inner Track -->
      <path
        d="M 152,268 C 182,295 210,326 215,358 C 220,388 205,412 176,424 C 145,435 108,425 82,398"
        stroke-width="10"
        fill="none"
      />
      <!-- Outermost Lower Sweeping Arc -->
      <path
        d="M 48,374 C 54,410 85,445 140,460 C 205,475 258,440 274,385 C 285,345 272,300 242,265"
        stroke-width="12"
        fill="none"
      />
      <!-- Bottom Lip Contour Arc -->
      <path
        d="M 55,424 C 84,452 135,468 188,460 C 225,452 254,428 266,392"
        stroke-width="8"
        fill="none"
      />
    </g>

    
    <!-- 6 Geodetic Survey Benchmark Hexagons -->
    <!-- Node 1: Top Apex -->
    <polygon points="252,32 242,49 222,49 212,32 222,15 242,15" fill="url(#hexGradLight)" stroke="#1f5e52" stroke-width="1.8" />
    <!-- Node 2: Upper Loop Interior -->
    <polygon points="242,142 235,154 221,154 214,142 221,130 235,130" fill="url(#hexGradLight)" stroke="#1f5e52" stroke-width="1.6" />
    <!-- Node 3: Middle-Right Apex -->
    <polygon points="304,222 294,240 274,240 264,222 274,204 294,204" fill="url(#hexGradLight)" stroke="#1f5e52" stroke-width="1.8" />
    <!-- Node 4: Center Spine Node -->
    <polygon points="171,268 163.5,281 148.5,281 141,268 148.5,255 163.5,255" fill="url(#hexGradDeep)" stroke="#1b544b" stroke-width="1.6" />
    <!-- Node 5: Lower-Left Outer Apex -->
    <polygon points="46,308 36,325.5 16,325.5 6,308 16,290.5 36,290.5" fill="url(#hexGradDeep)" stroke="#174c43" stroke-width="1.8" />
    <!-- Node 6: Lower Loop Interior -->
    <polygon points="90,404 83,416 69,416 62,404 69,392 83,392" fill="url(#hexGradDeep)" stroke="#174c43" stroke-width="1.6" />

  </g>
</svg>