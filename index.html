<!doctype html>
<html lang="ko" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta property="og:title" content="SOUL SURVEY (소울측량) - 작지만 가까운 측량 파트너" />
    <meta property="og:description" content="작지만 가까운 측량 파트너 · 정확한 현장 대응 · 20년+ 현장 경험. 필요한 측량, 편하게 이야기하세요." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/logo-symbol.svg" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    </noscript>
    <script>
      /* =========================================================
       * [소울측량 관리자 비밀번호 설정]
       * 관리자 모드(포트폴리오 수정, 현장 사진 업로드, 상담 내역 조회) 비밀번호입니다.
       * 아래 따옴표 안의 "1234"를 원하는 비밀번호로 변경하여 저장하시면 즉시 적용됩니다.
       * ========================================================= */
      const ADMIN_PASSWORD = "0330";
      window.ADMIN_PASSWORD = ADMIN_PASSWORD;
    </script>
    <style>
      /* Netlify 위젯 배지 숨기기 */
      [data-netlify-deploy-id],
      #netlify-badge,
      iframe[src*="netlify"] {
        display: none !important;
      }

      /* Netlify 강제 주입 프로모션 뱃지 및 iframe 완벽 차단 */
      netlify-badge,
      #netlify-badge,
      [class*="netlify"],
      [id*="netlify"],
      iframe[src*="netlify"],
      div[style*="z-index: 2147483647"],
      div[style*="position: fixed"][style*="bottom"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }

      /* CSS Scroll Snap: 한 화면(섹션) 단위 스크롤 */
      html, body {
        scroll-snap-type: y mandatory;
      }

      /* 각 섹션: 화면 전체 높이(100vh / 100dvh) 및 스크롤 스냅 */
      #hero,
      #about,
      #portfolio,
      #services,
      #contact,
      .snap-section {
        height: 100vh;
        height: 100dvh;
        scroll-snap-align: start;
        scroll-snap-stop: normal;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      /* 최하단 푸터 영역: 고정 해제 및 스크롤 스냅 연동 */
      footer,
      #main-footer {
        scroll-snap-align: start;
        scroll-snap-stop: normal;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-teal-700 selection:text-white">
    <!-- Netlify Forms Discovery Blueprint (Build-time detection for Netlify bot) -->
    <form name="survey-inquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="survey-inquiry" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="text" name="company" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="site-location" />
      <input type="text" name="survey-type" />
      <input type="text" name="desired-date" />
      <textarea name="message"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      // Netlify 강제 주입 뱃지 감지 및 삭제
      const removeNetlifyBadge = () => {
        const badgeElements = document.querySelectorAll('netlify-badge, #netlify-badge, [id*="netlify"], [class*="netlify"]');
        badgeElements.forEach(el => el.remove());
      };

      // 페이지 로드 시 및 일정 시간 동안 반복 실행하여 완전히 제거
      window.addEventListener('DOMContentLoaded', removeNetlifyBadge);
      window.addEventListener('load', removeNetlifyBadge);
      setInterval(removeNetlifyBadge, 500);
    </script>
  </body>
</html>
